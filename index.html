<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWUIS CRUEL — Toko Resmi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:linear-gradient(135deg,#0c1a12 0%,#143020 100%);color:#fff;min-height:100vh;padding:20px;padding-bottom:90px}
.container{max-width:410px;margin:0 auto}

.profil{text-align:center;margin-bottom:28px;padding-top:10px}
.pp{width:130px;height:130px;border-radius:50%;border:4px solid #00ee77;box-shadow:0 0 24px rgba(0,238,119,.25);object-fit:cover;margin-bottom:12px}
h1{font-size:22px;font-weight:700;color:#00ee77;margin-bottom:4px}
.desc{color:#8fbb9f;font-size:14px;letter-spacing:.5px}

.kartu{background:rgba(18,43,28,.7);border:1px solid rgba(0,238,119,.25);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 6px 16px rgba(0,0,0,.25);backdrop-filter:blur(10px)}
.kartu h2{font-size:17px;font-weight:600;color:#00ee77;margin-bottom:8px}
.kartu p{font-size:14px;color:#aaddbb;line-height:1.6;margin-bottom:6px}
.harga{font-size:17px;font-weight:700;color:#fff;margin:10px 0}
.harga em{color:#00ee77;font-style:normal}

.tombol{display:block;text-align:center;background:linear-gradient(90deg,#008844,#00aa55);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:12px;border-radius:14px;margin-top:14px;box-shadow:0 4px 12px rgba(0,136,68,.25);transition:.25s ease;border:none;cursor:pointer;width:100%}
.tombol:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,136,68,.3)}
.tombol.biru{background:linear-gradient(90deg,#0066aa,#0088dd);box-shadow:0 4px 12px rgba(0,102,170,.25)}
.tombol.biru:hover{box-shadow:0 6px 18px rgba(0,102,170,.3)}
.tombol.ungu{background:linear-gradient(90deg,#7733bb,#9955dd);box-shadow:0 4px 12px rgba(119,51,187,.25)}
.tombol.ungu:hover{box-shadow:0 6px 18px rgba(119,51,187,.3)}

.qr-tengah{text-align:center;padding:8px 0}
.qr-gambar{width:200px;height:200px;border-radius:16px;border:3px solid #00ee77;box-shadow:0 0 20px rgba(0,238,119,.2);object-fit:cover;margin-bottom:14px;background:#fff url('https://i.ibb.co/BHw67Cp4/IMG-20260906-WA0519-1.jpg') center/contain no-repeat}
.teks-dana{color:#aaddbb;font-size:14px;line-height:1.7}

.nav-bawah{position:fixed;bottom:0;left:0;right:0;background:rgba(12,26,18,.9);backdrop-filter:blur(12px);border-top:1px solid rgba(0,238,119,.2);display:flex;justify-content:space-around;padding:10px 0;
