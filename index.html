<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWUIS CRUEL — Toko Resmi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --prima:#00ff88;
  --gelap:#050f09;
  --kaca:rgba(16,43,28,0.6);
}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#050f09 0%,#0f2b1e 50%,#0a1f14 100%);
  color:#fff;min-height:100vh;padding-bottom:80px;
}
.bg-pola{
  position:fixed;inset:0;
  background: 
    radial-gradient(circle at 20% 30%, rgba(0,255,136,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,255,136,0.04) 0%, transparent 45%);
  pointer-events:none;z-index:0;
}
.container{max-width:420px;margin:0 auto;padding:20px;position:relative;z-index:1}

/* PROFIL */
.profil{text-align:center;margin:35px 0 30px}
.profil-img{
  width:130px;height:130px;border-radius:50%;
  border:3px solid var(--prima);
  box-shadow:0 0 25px rgba(0,255,136,0.4);
  object-fit:cover;margin-bottom:12px;
  animation:nyala 2s infinite alternate
}
@keyframes nyala{to{box-shadow:0 0 35px rgba(0,255,136,0.6)}}
.profil h1{font-size:26px;font-weight:800;
  background:linear-gradient(90deg,#fff,var(--prima));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.profil p{color:#888;font-size:14px;margin-top:6px}

/* KOTAK */
.kotak{
  background:var(--kaca);backdrop-filter:blur(12px);
  border:1px solid rgba(0,255,136,0.15);
  border-radius:20px;padding:22px;margin-bottom:20px;
  transition:all 0.3s ease
}
.kotak:hover{transform:translateY(-4px);
  box-shadow:0 10px 30px rgba(0,255,136,0.12)}
.judul{font-size:19px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.judul span{color:var(--prima);font-size:22px}

/* DAFTAR HARGA */
.item{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06)
}
.item:last-child{border:none}
.item-nama{font-weight:500;font-size:15px}
.item-harga{color:var(--prima);font-weight:700;font-size:16px}

/* PRODUK */
.produk-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.produk-kartu{
  background:rgba(0,255,136,0.07);border:1px solid rgba(0,255,136,0.18);
  border-radius:14px;padding:18px 10px;text-align:center;
  transition:all 0.3s ease;cursor:default
}
.produk-kartu:hover{background:rgba(0,255,136,0.15);transform:scale(1.05)}
.produk-nama{font-size:14px;font-weight:600}

/* QR */
.qr-box{text-align:center;padding:10px 5px}
.qr-img{width:230px;border-radius:14px;box-shadow:0 0 25px rgba(0,0,0,0.4);margin:12px 0}
.qr-ket{font-size:13px;color:#888;line-height:1.5}

/* TOMBOL */
.tombol{
  display:block;text-align:center;padding:15px;border-radius:14px;
  font-weight:700;font-size:16px;text-decoration:none;
  transition:all 0.3s ease;margin:12px 0
}
.tombol-wa{
  background:linear-gradient(90deg,#25d366,#128c7e);color:#fff
}
.tombol-wa:hover{transform:scale(1.03);box-shadow:0 6px 20px rgba(37,211,102,0.35)}

/* NAV BAWAH */
.nav-bawah{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,31,20,0.9);backdrop-filter:blur(15px);
  border-top:1px solid rgba(0,255,136,0.12);
  display:flex;justify-content:space-around;padding:12px 0;z-index:99
}
.nav-link{text-align:center;color:#777;text-decoration:none;font-size:11px;transition:0.3s}
.nav-link.aktif{color:var(--prima)}
.nav-link span{display:block;font-size:20px;margin-bottom:2px}
</style>
</head>
<body>

<div class="bg-pola"></div>
<div class="container">

<!-- PROFIL -->
<div class="profil">
  <img src="https://i.ibb.co.com/DHGFRKG7" alt="SWUIS CRUEL" class="profil-img">
  <h1>SWUIS CRUEL</h1>
  <p>✨ Toko Resmi — Terpercaya & Pelayanan Cepat</p>
</div>

<!-- HARGA JOKI -->
<div class="kotak">
  <h2 class="judul"><span>🏆</span> Daftar Harga Joki</h2>
  <div class="item"><span class="item-nama">1 Hari</span><span class="item-harga">Rp 1.000</span></div>
  <div class="item"><span class="item-nama">2 Hari</span><span class="item-harga">Rp 2.000</span></div>
  <div class="item"><span class="item-nama">5 Hari</span><span class="item-harga">Rp 5.000</span></div>
  <div class="item"><span class="item-nama">Permanen</span><span class="item-harga">Rp 1
