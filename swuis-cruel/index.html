<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWUIS CRUEL — OPEN JOKI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
        body{background:#0f1f14;color:#fff;text-align:center;padding:15px}
        .header{margin-bottom:25px}
        .logo{width:90px;height:90px;border-radius:50%;background:#10b947;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:#000}
        .nama{font-size:26px;font-weight:bold;color:#39ff5c}
        .verif{background:#10b947;color:#000;border-radius:50%;font-size:14px;padding:2px 7px;display:inline-block;margin-left:6px}
        .desk{color:#b0f0b8;margin-top:5px}
        .banner{background:linear-gradient(135deg,#0f351f,#1a4a2f);border-radius:16px;padding:35px 20px;margin:20px 0;border:2px solid #23d15e}
        .banner h1{font-size:32px;color:#39ff5c}
        .banner p{color:#b0f0b8;margin-top:8px}
        .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
        .btn{background:#1a3b28;border:2px solid #39ff5c;color:#39ff5c;padding:12px 8px;border-radius:10px;font-size:15px;font-weight:bold}
        .btn.besar{padding:18px;font-size:17px;background:#205534;color:#caff39;border-color:#caff39}
        .info-bar{background:#142e20;border-radius:10px;padding:12px;margin:18px 0;color:#8cf09c}
        .nav{position:fixed;bottom:0;left:0;right:0;background:#0f2418;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #23d15e}
        .nav div{color:#8cf09c;font-size:13px;text-align:center}
        .nav .aktif{color:#39ff5c;font-weight:bold}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">S</div>
        <div class="nama">SWUIS CRUEL <span class="verif">✓</span></div>
        <div class="desk">OPEN JOKI — Layanan Joki & Produk Digital</div>
    </div>

    <div class="banner">
        <h1>Selamat Datang</h1>
        <h2 style="color:#caff39;margin-top:8px">di SWUIS CRUEL</h2>
        <p>Pusat Layanan Joki & Produk Digital</p>
    </div>

    <div class="btn-row">
        <div class="btn">Joki Kontak</div>
        <div class="btn">Produk Digital</div>
    </div>
    <div class="btn-row" style="grid-template-columns:1fr">
        <div class="btn">JASA LOGO</div>
    </div>
    <div class="btn-row">
        <div class="btn besar">Jasa Joki</div>
        <div class="btn besar">JASA LOGO</div>
    </div>

    <div class="info-bar">🔥 OPEN JOKI • APK PREMIUM • NOKOS • WEB ALL</div>

    <div style="height:60px"></div>
    <div class="nav">
        <div class="aktif">🏠<br>Home</div>
        <div>🛡️<br>Joki</div>
        <div>🛍️<br>Produk</div>
        <div>ℹ️<br>Tentang</div>
    </div>
</body>
      </html>
